<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>33m2 딥링크 생성기</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--fg:#1f2937;--muted:#6b7280;--border:#e5e7eb;--accent:#2563eb;--accent-soft:#eff6ff;--ok:#059669;--warn:#b45309;--warn-bg:#fffbeb}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--fg)}
header{background:var(--card);border-bottom:1px solid var(--border);padding:18px 24px}
header h1{margin:0;font-size:20px}
header p{margin:6px 0 0;color:var(--muted);font-size:13px}
.wrap{display:grid;grid-template-columns:380px 1fr;gap:20px;max-width:1280px;margin:20px auto;padding:0 20px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.search{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
.chips{display:flex;gap:6px;margin:10px 0}
.chip{white-space:nowrap;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:5px 14px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.list{max-height:62vh;overflow:auto;margin-top:6px;display:flex;flex-direction:column;gap:4px}
.item{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:9px 10px;cursor:pointer;font-size:14px}
.item:hover{background:var(--accent-soft)}
.item.on{background:var(--accent-soft);border-color:var(--accent)}
.item .aud{display:inline-block;font-size:11px;border-radius:4px;padding:1px 6px;margin-right:6px;font-weight:700}
.aud.t{background:#ecfdf5;color:#047857}.aud.l{background:#eff6ff;color:#1d4ed8}.aud.c{background:#f5f3ff;color:#6d28d9}
.item .ty{display:block;color:var(--muted);font-size:11px;margin-top:2px;font-family:ui-monospace,Consolas,monospace}
h2{font-size:16px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input[type=text],select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.out{margin-top:16px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.out h3{margin:0;padding:9px 14px;font-size:13px;background:#f9fafb;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.out .use{font-weight:400;color:var(--muted);font-size:12px}
.out .body{display:flex;gap:10px;align-items:center;padding:12px 14px}
.out code{flex:1;font-size:13px;word-break:break-all;font-family:ui-monospace,Consolas,monospace}
.copy{border:1px solid var(--border);background:#fff;border-radius:7px;padding:7px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
.note{margin-top:14px;padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.na{color:var(--muted);font-style:italic}
.empty{color:var(--muted);text-align:center;padding:60px 0}
.count{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>

const DOMAINS = [["33m2.co.kr","운영 (33m2.co.kr)"],["web.33m2-hub.link","테스트 (web.33m2-hub.link)"]];
let state = { q:"", aud:"", sel:null, domain:localStorage.getItem("dl_domain")||"33m2.co.kr", customDomain:localStorage.getItem("dl_custom")||"", vals:{} };
const $=s=>document.querySelector(s);
function audCls(a){return a==="임차인"?"t":a==="임대인"?"l":"c"}
function filtered(){
 const q=state.q.toLowerCase();
 return DATA.map((d,i)=>({...d,i})).filter(d=>(!state.aud||d.audience===state.aud)&&(!q||(d.screen+d.type+d.audience).toLowerCase().includes(q)));
}
function renderList(){
 const items=filtered();
 $("#list").innerHTML=items.map(d=>`<button class="item ${state.sel===d.i?"on":""}" data-i="${d.i}"><span class="aud ${audCls(d.audience)}">${d.audience}</span>${d.screen}<span class="ty">${d.type}</span></button>`).join("")||'<div class="empty">검색 결과 없음</div>';
 $("#count").textContent=`${items.length} / ${DATA.length}개 화면`;
}
function domainValue(){return state.domain==="__custom__"?state.customDomain.trim():state.domain}
function fill(tpl,d){
 if(!tpl)return null;
 let out=tpl,missing=false;
 out=out.replace(/[$#]\{([^}]+)\}/g,(m,k)=>{
  if(k==="domain"){const dv=domainValue();if(!dv)missing=true;return dv||"(도메인)";}
  const v=d.vars.find(x=>x.aliases.includes(k)||x.canon===k);
  const raw=v?(state.vals[v.canon]||""):"";
  if(!raw&&!(v&&v.optional))missing=true;
  return raw?encodeURIComponent(raw):(v&&v.optional?"":`(${v?v.label:k})`);
 });
 return {url:out,missing};
}
function outCard(title,use,res){
 if(!res)return `<div class="out"><h3>${title}<span class="use">${use}</span></h3><div class="body"><code class="na">이 화면은 ${title}를 지원하지 않습니다 (시트 기준)</code></div></div>`;
 return `<div class="out"><h3>${title}<span class="use">${use}</span></h3><div class="body"><code>${res.url}</code><button class="copy" data-url="${res.url.replace(/"/g,"&quot;")}" ${res.missing?"disabled":""}>복사</button></div></div>`;
}
function renderDetail(){
 if(state.sel===null){$("#detail").innerHTML='<div class="empty">왼쪽에서 화면을 선택하세요</div>';return}
 const d=DATA[state.sel];
 const needDomain=/[#$]\{domain\}/.test(d.pcUrl+d.appLink+d.bridge);

 h+=`<div class="row">`;
 if(needDomain){
  h+=`<div><label>도메인</label><select id="dom">${DOMAINS.map(([v,l])=>`<option value="${v}" ${state.domain===v?"selected":""}>${l}</option>`).join("")}<option value="__custom__" ${state.domain==="__custom__"?"selected":""}>직접 입력</option></select>`;
  if(state.domain==="__custom__")h+=`<input type="text" id="domCustom" style="margin-top:8px" placeholder="예: staging.33m2.co.kr" value="${state.customDomain}">`;
  h+=`</div>`;
 }
 for(const v of d.vars){
  h+=`<div><label>${v.label}${v.optional?" (선택)":""}</label><input type="text" class="var" data-k="${v.canon}" value="${state.vals[v.canon]||""}" placeholder="${v.label} 입력"></div>`;
 }
 h+=`</div>`;
 h+=outCard("앱 스킴","앱 설치된 기기에서 바로 열기 (푸시 등)",fill(d.scheme,d));
 h+=outCard("딥링크 (앱 링크)","문자·알림톡 등 외부 발송용",fill(d.appLink,d));
 h+=outCard("통합 링크 (브릿지)","짧은 공용 링크",fill(d.bridge,d));
 h+=outCard("PC 웹 URL","브라우저에서 열기",fill(d.pcUrl,d));
 const warns=[];
 if(d.vars.some(v=>!v.optional&&!state.vals[v.canon]))warns.push("식별값을 입력하면 복사 버튼이 활성화됩니다.");
 if(d.type==="tenant_review_detail")warns.push("시트 원본의 스킴 오타(&idx 누락)를 보정한 링크입니다.");
 if(warns.length)h+=`<div class="note">${warns.join("<br>")}</div>`;
 $("#detail").innerHTML=h;
 const dom=$("#dom");
 if(dom)dom.onchange=e=>{state.domain=e.target.value;localStorage.setItem("dl_domain",state.domain);renderDetail()};
 const dc=$("#domCustom");
 if(dc)dc.oninput=e=>{state.customDomain=e.target.value;localStorage.setItem("dl_custom",state.customDomain);refreshOutputs(d)};
 document.querySelectorAll(".var").forEach(el=>el.oninput=e=>{state.vals[e.target.dataset.k]=e.target.value;refreshOutputs(d)});
 bindCopy();
}
function refreshOutputs(d){
 const keep=[];document.querySelectorAll(".var").forEach(el=>keep.push([el.dataset.k,el.selectionStart]));
 const active=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.k:null;
 renderDetail();
 if(active){const el=document.querySelector(`.var[data-k="${active}"]`)||$("#domCustom");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
}
function bindCopy(){
 document.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{
  try{await navigator.clipboard.writeText(b.dataset.url)}catch(e){const t=document.createElement("textarea");t.value=b.dataset.url;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
  b.textContent="복사됨";b.classList.add("done");setTimeout(()=>{b.textContent="복사";b.classList.remove("done")},1200);
 });
}
$("#q").oninput=e=>{state.q=e.target.value;renderList()};
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");state.aud=c.dataset.a;renderList()});
$("#list").onclick=e=>{const b=e.target.closest(".item");if(!b)return;state.sel=+b.dataset.i;state.vals={};renderList();renderDetail()};
renderList();
</script>
